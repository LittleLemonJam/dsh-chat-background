name: Feature request / 功能建议
description: 提出新功能或改进 / Suggest a feature or improvement
title: '[feature] '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue 与路线图（README 的「路线图」一节）。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 当前哪里让你不顺手？尽可能给出使用场景
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposal
      description: 你希望它是什么样（设置项形态、默认值、交互）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 你考虑过的其他做法或临时绕过方式

  - type: dropdown
    id: area
    attributes:
      label: 影响范围 / Area
      multiple: true
      options:
        - 背景图与遮罩 / background and scrim
        - 侧栏 / sidebar
        - 输入栏背景条 / composer strip
        - 任务进度条 / task progress
        - Token 总用量 / token total
        - 设置页与持久化 / settings and storage
        - 安装/发布 / install or distribution
        - 其它 / other

  - type: checkboxes
    id: contribution
    attributes:
      label: 是否愿意提交 PR / Willing to contribute a PR
      options:
        - label: 愿意，我可以按 CONTRIBUTING.md 的流程提交
