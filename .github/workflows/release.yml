name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # npm Trusted Publishing exchanges this OIDC token for a short-lived
  # publish credential; no long-lived NPM_TOKEN secret is stored anywhere.
  id-token: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use an npm with Trusted Publishing support
        run: |
          npm install --global 'npm@^11.5.1'
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi

      - name: Full verification
        run: npm run verify

      - name: Build npm tarball
        run: npm pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ./dsh-chat-background-*.tgz

      - name: Publish to npm
        # Idempotent: a rerun after a partial failure skips an existing version.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-chat-background@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-chat-background@$VERSION is already published"
            exit 0
          fi
          npm publish --access public --provenance
